name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: moneta_ci
          POSTGRES_USER: moneta_ci
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DJANGO_DEBUG: '1'
      DJANGO_SECRET_KEY: synthetic-ci-key-used-only-in-disposable-tests-1234567890
      DB_ENGINE: ${{ matrix.database == 'postgres' && 'django.db.backends.postgresql' || 'django.db.backends.sqlite3' }}
      DB_NAME: ${{ matrix.database == 'postgres' && 'moneta_ci' || 'ci.sqlite3' }}
      DB_USER: moneta_ci
      DB_PASSWORD: synthetic-ci-only
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt -r requirements-postgres.txt coverage
      - run: python manage.py migrate --noinput
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m coverage run --source=finanzas,config manage.py test --noinput
      - run: python -m coverage report
      - run: python manage.py secret_scan
      - name: Production configuration checks
        env:
          DJANGO_DEBUG: '0'
          DJANGO_CACHE_BACKEND: db
        run: python manage.py check --deploy --fail-level WARNING
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt -r requirements-postgres.txt
      - name: Scan public history and working tree with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSL "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl -fsSL "$base/gitleaks_${version}_checksums.txt" -o "$RUNNER_TEMP/checksums.txt"
          (cd "$RUNNER_TEMP" && grep " ${archive}$" checksums.txt | sha256sum --check)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner .
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner .
